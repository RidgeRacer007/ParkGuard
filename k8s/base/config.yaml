apiVersion: v1
kind: ConfigMap
metadata: {name: parkguard-config, namespace: parkguard}
data:
  MONGO_URI: mongodb://mongo:27017
  MONGO_DB: parkguard
  MINIO_ENDPOINT: minio:9000
  MINIO_BUCKET: parkguard-photos
  # OpenTelemetry — points to the cluster-internal OTLP collector (gRPC).
  # Remove or leave empty to disable tracing.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_SERVICE_NAME: parkguard-api
---
apiVersion: v1
kind: Secret
metadata: {name: parkguard-secrets, namespace: parkguard}
type: Opaque
stringData:
  PARKGUARD_DEVICE_KEYS: '{"demo-node":"replace-me"}'
  MINIO_ACCESS_KEY: replace-me
  MINIO_SECRET_KEY: replace-me
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""
