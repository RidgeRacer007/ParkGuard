services:
  api:
    build: .
    env_file: [.env]
    ports: ["8000:8000"]
    environment:
      PARKGUARD_STORAGE: local
      MONGO_URI: mongodb://mongo:27017
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-parkguard}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me}
    volumes: ["./data:/app/data"]
    depends_on: [mongo,minio]
  mongo:
    image: mongo:7
    volumes: ["mongo_data:/data/db"]
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-parkguard}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me}
    ports: ["9001:9001"]
    volumes: ["minio_data:/data"]
  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:11.2.2
    ports: ["3000:3000"]
    volumes: ["./ops/grafana:/etc/grafana/provisioning:ro"]
volumes:
  mongo_data: {}
  minio_data: {}
