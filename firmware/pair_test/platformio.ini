[platformio]
default_envs = devkit

[env:devkit]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

[env:cam]
platform = espressif32
board = esp32cam
framework = arduino
build_flags = -DPARKGUARD_CAM=1
monitor_speed = 115200
upload_speed = 115200
